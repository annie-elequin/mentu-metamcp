version: '3.8'

services:
  mentu-metamcp:
    build:
      context: ./metamcp
      dockerfile: Dockerfile
    container_name: mentu-metamcp
    restart: unless-stopped
    ports:
      - "${METAMCP_PORT:-8080}:8080"
    environment:
      - METAMCP_HTTP_BEARER_TOKEN=${METAMCP_HTTP_BEARER_TOKEN}
      - METAMCP_ALLOWED_ORIGINS=${METAMCP_ALLOWED_ORIGINS:-}
    volumes:
      - ${MENTU_CONFIG_PATH:-mentu-metamcp-config}:/config
    healthcheck:
      # /mcp is the real gateway path (no /health). Missing bearer often returns 401/405/406 — still "up".
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8080/mcp', (r) => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  mentu-metamcp-ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: mentu-metamcp-ui
    restart: unless-stopped
    ports:
      - "${UI_PORT:-3000}:3000"
    environment:
      - METAMCP_HTTP_BEARER_TOKEN=${METAMCP_HTTP_BEARER_TOKEN}
    volumes:
      - ${MENTU_CONFIG_PATH:-mentu-metamcp-config}:/config
    depends_on:
      - mentu-metamcp

networks:
  default:
    name: mcp
    external: true
