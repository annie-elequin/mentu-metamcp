<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetaMCP Config Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .header {
            background: #2c3e50;
            color: white;
            padding: 20px;
            border-bottom: 3px solid #3498db;
        }
        .header h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        .header p {
            opacity: 0.9;
            font-size: 14px;
        }
        .editor-container {
            padding: 20px;
        }
        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }
        button.primary {
            background: #3498db;
            color: white;
        }
        button.primary:hover {
            background: #2980b9;
        }
        button.secondary {
            background: #95a5a6;
            color: white;
        }
        button.secondary:hover {
            background: #7f8c8d;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        textarea {
            width: 100%;
            height: 500px;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 4px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 13px;
            line-height: 1.5;
            resize: vertical;
        }
        textarea:focus {
            outline: none;
            border-color: #3498db;
        }
        .message {
            padding: 12px 15px;
            margin-bottom: 15px;
            border-radius: 4px;
            font-size: 14px;
        }
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .hidden {
            display: none;
        }
        .token-input {
            margin-bottom: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 4px;
            border: 1px solid #dee2e6;
        }
        .token-input label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
        }
        .token-input input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: monospace;
            font-size: 13px;
        }
        .token-input input:focus {
            outline: none;
            border-color: #3498db;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>MetaMCP Config Editor</h1>
            <p>Edit your .mcp.json configuration file. Changes are saved to the shared volume and MetaMCP reloads automatically.</p>
        </div>
        <div class="editor-container">
            <div class="token-input">
                <label for="bearerToken">Bearer Token (required for load/save):</label>
                <input type="password" id="bearerToken" placeholder="Enter your METAMCP_HTTP_BEARER_TOKEN">
            </div>
            
            <div id="message" class="message hidden"></div>
            
            <div class="toolbar">
                <button id="loadBtn" class="primary">Load Config</button>
                <button id="saveBtn" class="primary">Save Config</button>
                <button id="formatBtn" class="secondary">Format JSON</button>
                <button id="validateBtn" class="secondary">Validate JSON</button>
            </div>
            
            <textarea id="editor" placeholder="Click 'Load Config' to load .mcp.json"></textarea>
        </div>
    </div>

    <script>
        const editor = document.getElementById('editor');
        const bearerTokenInput = document.getElementById('bearerToken');
        const messageEl = document.getElementById('message');
        const loadBtn = document.getElementById('loadBtn');
        const saveBtn = document.getElementById('saveBtn');
        const formatBtn = document.getElementById('formatBtn');
        const validateBtn = document.getElementById('validateBtn');

        function showMessage(text, type = 'info') {
            messageEl.textContent = text;
            messageEl.className = `message ${type}`;
            messageEl.classList.remove('hidden');
            setTimeout(() => {
                messageEl.classList.add('hidden');
            }, 5000);
        }

        function getAuthHeader() {
            const token = bearerTokenInput.value.trim();
            if (!token) {
                showMessage('Bearer token is required', 'error');
                return null;
            }
            return `Bearer ${token}`;
        }

        async function loadConfig() {
            const authHeader = getAuthHeader();
            if (!authHeader) return;

            loadBtn.disabled = true;
            try {
                const response = await fetch('/api/config', {
                    headers: {
                        'Authorization': authHeader
                    }
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || `HTTP ${response.status}`);
                }
                
                const data = await response.json();
                editor.value = data.content;
                showMessage('Config loaded successfully', 'success');
            } catch (error) {
                showMessage(`Failed to load config: ${error.message}`, 'error');
            } finally {
                loadBtn.disabled = false;
            }
        }

        async function saveConfig() {
            const authHeader = getAuthHeader();
            if (!authHeader) return;

            const content = editor.value.trim();
            if (!content) {
                showMessage('Config content cannot be empty', 'error');
                return;
            }

            // Validate JSON before saving
            try {
                JSON.parse(content);
            } catch (e) {
                showMessage(`Invalid JSON: ${e.message}`, 'error');
                return;
            }

            saveBtn.disabled = true;
            try {
                const response = await fetch('/api/config', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': authHeader
                    },
                    body: JSON.stringify({ content })
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || `HTTP ${response.status}`);
                }
                
                const data = await response.json();
                showMessage(data.message || 'Config saved successfully', 'success');
            } catch (error) {
                showMessage(`Failed to save config: ${error.message}`, 'error');
            } finally {
                saveBtn.disabled = false;
            }
        }

        function formatJSON() {
            try {
                const content = editor.value.trim();
                if (!content) return;
                
                const parsed = JSON.parse(content);
                editor.value = JSON.stringify(parsed, null, 2);
                showMessage('JSON formatted successfully', 'success');
            } catch (e) {
                showMessage(`Cannot format: ${e.message}`, 'error');
            }
        }

        function validateJSON() {
            try {
                const content = editor.value.trim();
                if (!content) {
                    showMessage('Editor is empty', 'error');
                    return;
                }
                
                JSON.parse(content);
                showMessage('JSON is valid', 'success');
            } catch (e) {
                showMessage(`Invalid JSON: ${e.message}`, 'error');
            }
        }

        // Event listeners
        loadBtn.addEventListener('click', loadConfig);
        saveBtn.addEventListener('click', saveConfig);
        formatBtn.addEventListener('click', formatJSON);
        validateBtn.addEventListener('click', validateJSON);

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                saveConfig();
            }
        });

        // Load bearer token from localStorage if available
        const savedToken = localStorage.getItem('bearerToken');
        if (savedToken) {
            bearerTokenInput.value = savedToken;
        }

        // Save bearer token to localStorage on change
        bearerTokenInput.addEventListener('change', () => {
            localStorage.setItem('bearerToken', bearerTokenInput.value);
        });
    </script>
</body>
</html>
