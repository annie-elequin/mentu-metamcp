<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetaMCP Config Editor</title>
    
    <!-- CodeMirror 5 CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldgutter.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .header {
            background: #2c3e50;
            color: white;
            padding: 20px;
            border-bottom: 3px solid #3498db;
        }
        .header h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        .header p {
            opacity: 0.9;
            font-size: 14px;
        }
        .editor-container {
            padding: 20px;
        }
        .server-status-section {
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 6px;
            border: 1px solid #dee2e6;
        }
        .server-status-section h2 {
            font-size: 16px;
            margin-bottom: 12px;
            color: #2c3e50;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .server-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 12px;
        }
        .server-card {
            background: white;
            padding: 12px;
            border-radius: 6px;
            border: 2px solid #e0e0e0;
        }
        .server-card.reachable {
            border-color: #27ae60;
        }
        .server-card.unreachable {
            border-color: #e74c3c;
        }
        .server-card-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .server-status-badge {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .server-status-badge.reachable {
            background: #27ae60;
        }
        .server-status-badge.unreachable {
            background: #e74c3c;
        }
        .server-name {
            font-weight: 600;
            font-size: 14px;
            flex: 1;
            word-break: break-word;
        }
        .server-transport {
            font-size: 11px;
            color: #7f8c8d;
            background: #ecf0f1;
            padding: 2px 6px;
            border-radius: 3px;
        }
        .server-error {
            font-size: 12px;
            color: #e74c3c;
            margin-top: 4px;
        }
        .server-tools {
            margin-top: 8px;
        }
        .server-tools summary {
            cursor: pointer;
            font-size: 12px;
            color: #3498db;
            user-select: none;
        }
        .server-tools summary:hover {
            color: #2980b9;
        }
        .tools-list {
            margin-top: 6px;
            padding-left: 0;
            list-style: none;
        }
        .tool-item {
            font-size: 12px;
            padding: 4px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .tool-item:last-child {
            border-bottom: none;
        }
        .tool-name {
            font-weight: 500;
            color: #2c3e50;
        }
        .tool-description {
            color: #7f8c8d;
            margin-left: 4px;
        }
        .no-servers {
            text-align: center;
            color: #7f8c8d;
            padding: 20px;
            font-size: 14px;
        }
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }
        button.primary {
            background: #3498db;
            color: white;
        }
        button.primary:hover {
            background: #2980b9;
        }
        button.secondary {
            background: #95a5a6;
            color: white;
        }
        button.secondary:hover {
            background: #7f8c8d;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .CodeMirror {
            border: 2px solid #ddd;
            border-radius: 4px;
            height: 500px;
            font-size: 13px;
        }
        .CodeMirror-focused {
            border-color: #3498db;
        }
        .message {
            padding: 12px 15px;
            margin-bottom: 15px;
            border-radius: 4px;
            font-size: 14px;
        }
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .hidden {
            display: none;
        }
        .token-input {
            margin-bottom: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 4px;
            border: 1px solid #dee2e6;
        }
        .token-input label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
        }
        .token-input input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: monospace;
            font-size: 13px;
        }
        .token-input input:focus {
            outline: none;
            border-color: #3498db;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>MetaMCP Config Editor</h1>
            <p>Edit your .mcp.json configuration file. Changes are saved to the shared volume and MetaMCP reloads automatically.</p>
        </div>
        <div class="editor-container">
            <div class="token-input">
                <label for="bearerToken">Bearer Token (required for load/save):</label>
                <input type="password" id="bearerToken" placeholder="Enter your METAMCP_HTTP_BEARER_TOKEN">
            </div>
            
            <div id="message" class="message hidden"></div>
            
            <div class="server-status-section">
                <h2>
                    <span>MCP Server Status</span>
                    <button id="refreshStatusBtn" class="secondary" style="padding: 6px 12px; font-size: 12px;">Refresh</button>
                </h2>
                <div id="serverStatusContainer">
                    <div class="no-servers">Click 'Load Config' first, then 'Refresh' to check server health</div>
                </div>
            </div>
            
            <div class="toolbar">
                <button id="loadBtn" class="primary">Load Config</button>
                <button id="saveBtn" class="primary">Save Config</button>
                <button id="formatBtn" class="secondary">Format JSON</button>
                <button id="validateBtn" class="secondary">Validate JSON</button>
            </div>
            
            <div id="editor"></div>
        </div>
    </div>

    <!-- CodeMirror 5 JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldcode.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldgutter.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/brace-fold.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/comment-fold.js"></script>

    <script>
        // Initialize CodeMirror
        const editorElement = document.getElementById('editor');
        const cmEditor = CodeMirror(editorElement, {
            mode: { name: "javascript", json: true },
            theme: "default",
            lineNumbers: true,
            lineWrapping: true,
            indentUnit: 2,
            tabSize: 2,
            indentWithTabs: false,
            foldGutter: true,
            gutters: ["CodeMirror-linenumbers", "CodeMirror-foldgutter"],
            placeholder: "Click 'Load Config' to load .mcp.json"
        });

        const bearerTokenInput = document.getElementById('bearerToken');
        const messageEl = document.getElementById('message');
        const loadBtn = document.getElementById('loadBtn');
        const saveBtn = document.getElementById('saveBtn');
        const formatBtn = document.getElementById('formatBtn');
        const validateBtn = document.getElementById('validateBtn');
        const refreshStatusBtn = document.getElementById('refreshStatusBtn');
        const serverStatusContainer = document.getElementById('serverStatusContainer');

        function showMessage(text, type = 'info') {
            messageEl.textContent = text;
            messageEl.className = `message ${type}`;
            messageEl.classList.remove('hidden');
            setTimeout(() => {
                messageEl.classList.add('hidden');
            }, 5000);
        }

        function renderServerStatus(servers) {
            if (!servers || servers.length === 0) {
                serverStatusContainer.innerHTML = '<div class="no-servers">No MCP servers configured</div>';
                return;
            }

            const serverCards = servers.map(server => {
                const reachableClass = server.reachable ? 'reachable' : 'unreachable';
                const statusBadgeClass = server.reachable ? 'reachable' : 'unreachable';
                
                let toolsHtml = '';
                if (server.error) {
                    toolsHtml = `<div class="server-error">${server.error}</div>`;
                } else if (server.tools && server.tools.length > 0) {
                    const toolsList = server.tools.map(tool => `
                        <li class="tool-item">
                            <span class="tool-name">${tool.name}</span>
                            ${tool.description ? `<span class="tool-description">- ${tool.description}</span>` : ''}
                        </li>
                    `).join('');
                    toolsHtml = `
                        <details class="server-tools">
                            <summary>Tools (${server.tools.length})</summary>
                            <ul class="tools-list">${toolsList}</ul>
                        </details>
                    `;
                } else if (server.reachable) {
                    toolsHtml = '<div class="server-error">Reachable but no tools found</div>';
                }

                return `
                    <div class="server-card ${reachableClass}">
                        <div class="server-card-header">
                            <span class="server-status-badge ${statusBadgeClass}"></span>
                            <span class="server-name">${server.name}</span>
                            <span class="server-transport">${server.transportType}</span>
                        </div>
                        ${toolsHtml}
                    </div>
                `;
            }).join('');

            serverStatusContainer.innerHTML = `<div class="server-cards">${serverCards}</div>`;
        }

        async function refreshServerStatus() {
            const authHeader = getAuthHeader();
            if (!authHeader) return;

            refreshStatusBtn.disabled = true;
            refreshStatusBtn.innerHTML = '<span class="loading-spinner"></span>';

            try {
                const response = await fetch('/api/servers/status', {
                    headers: {
                        'Authorization': authHeader
                    }
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || `HTTP ${response.status}`);
                }
                
                const data = await response.json();
                renderServerStatus(data.servers);
                showMessage(`Checked ${data.servers.length} server(s)`, 'success');
            } catch (error) {
                showMessage(`Failed to check server status: ${error.message}`, 'error');
            } finally {
                refreshStatusBtn.disabled = false;
                refreshStatusBtn.textContent = 'Refresh';
            }
        }

        function getAuthHeader() {
            const token = bearerTokenInput.value.trim();
            if (!token) {
                showMessage('Bearer token is required', 'error');
                return null;
            }
            return `Bearer ${token}`;
        }

        async function loadConfig() {
            const authHeader = getAuthHeader();
            if (!authHeader) return;

            loadBtn.disabled = true;
            try {
                const response = await fetch('/api/config', {
                    headers: {
                        'Authorization': authHeader
                    }
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || `HTTP ${response.status}`);
                }
                
                const data = await response.json();
                cmEditor.setValue(data.content);
                showMessage('Config loaded successfully', 'success');
            } catch (error) {
                showMessage(`Failed to load config: ${error.message}`, 'error');
            } finally {
                loadBtn.disabled = false;
            }
        }

        async function saveConfig() {
            const authHeader = getAuthHeader();
            if (!authHeader) return;

            const content = cmEditor.getValue().trim();
            if (!content) {
                showMessage('Config content cannot be empty', 'error');
                return;
            }

            // Validate JSON before saving
            try {
                JSON.parse(content);
            } catch (e) {
                showMessage(`Invalid JSON: ${e.message}`, 'error');
                return;
            }

            saveBtn.disabled = true;
            try {
                const response = await fetch('/api/config', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': authHeader
                    },
                    body: JSON.stringify({ content })
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || `HTTP ${response.status}`);
                }
                
                const data = await response.json();
                showMessage(data.message || 'Config saved successfully', 'success');
            } catch (error) {
                showMessage(`Failed to save config: ${error.message}`, 'error');
            } finally {
                saveBtn.disabled = false;
            }
        }

        function formatJSON() {
            try {
                const content = cmEditor.getValue().trim();
                if (!content) return;
                
                const parsed = JSON.parse(content);
                cmEditor.setValue(JSON.stringify(parsed, null, 2));
                showMessage('JSON formatted successfully', 'success');
            } catch (e) {
                showMessage(`Cannot format: ${e.message}`, 'error');
            }
        }

        function validateJSON() {
            try {
                const content = cmEditor.getValue().trim();
                if (!content) {
                    showMessage('Editor is empty', 'error');
                    return;
                }
                
                JSON.parse(content);
                showMessage('JSON is valid', 'success');
            } catch (e) {
                showMessage(`Invalid JSON: ${e.message}`, 'error');
            }
        }

        // Event listeners
        loadBtn.addEventListener('click', loadConfig);
        saveBtn.addEventListener('click', saveConfig);
        formatBtn.addEventListener('click', formatJSON);
        validateBtn.addEventListener('click', validateJSON);
        refreshStatusBtn.addEventListener('click', refreshServerStatus);

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                saveConfig();
            }
        });

        // Load bearer token from localStorage if available
        const savedToken = localStorage.getItem('bearerToken');
        if (savedToken) {
            bearerTokenInput.value = savedToken;
        }

        // Save bearer token to localStorage on change
        bearerTokenInput.addEventListener('change', () => {
            localStorage.setItem('bearerToken', bearerTokenInput.value);
        });
    </script>
</body>
</html>
